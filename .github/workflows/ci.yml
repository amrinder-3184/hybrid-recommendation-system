name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check .

    - name: Run Pytest
      run: |
        pytest tests/ --html=report.html --self-contained-html

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-report
        path: report.html

  build-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build API Docker Image
      run: docker build --target production -t recommender-api:latest -f Dockerfile.api .

    - name: Build Frontend Docker Image
      run: docker build --target production -t recommender-frontend:latest -f Dockerfile.frontend .
